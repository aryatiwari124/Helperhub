services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    ports:
      - "5000:5000"
      - "5173:5173"
    environment:
      MONGO_URI: mongodb://mongo:27017/helperhub
      CLIENT_URL: http://localhost:5173
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      - mongo

volumes:
  mongo-data: