services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/helperhub
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

volumes:
  mongo-data: