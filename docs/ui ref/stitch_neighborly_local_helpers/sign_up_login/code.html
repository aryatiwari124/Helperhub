<style>
        .input-floating-label {
            position: relative;
        }
        .input-floating-label input {
            padding-top: 1.5rem;
            padding-bottom: 0.5rem;
        }
        .input-floating-label label {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            transition: all 0.2s ease-out;
            pointer-events: none;
            color: #56423c; /* on-surface-variant */
        }
        .input-floating-label input:focus + label,
        .input-floating-label input:not(:placeholder-shown) + label {
            top: 0.5rem;
            font-size: 0.75rem;
            transform: translateY(0);
            color: #9d3e20; /* primary */
        }
        .input-floating-label input:focus {
            border-color: #9d3e20; /* primary */
            ring-color: #9d3e20;
        }
      </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-body-md text-on-background">
<!-- Suppressed TopNavBar and Footer as per semantic shell mandate for transactional screens (Login/Signup) -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-[24px] shadow-md border border-outline-variant/30 overflow-hidden relative">
<!-- Subtle top decorative accent -->
<div class="h-2 w-full bg-primary absolute top-0 left-0"></div>
<div class="p-8 md:p-10 flex flex-col gap-stack-lg relative z-10">
<!-- Header -->
<div class="text-center flex flex-col gap-stack-sm items-center">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">waving_hand</span>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Welcome to NeighborlyTasks</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to connect with your community</p>
</div>
<!-- Social Sign In -->
<button class="w-full flex items-center justify-center gap-unit py-3 px-4 rounded-xl border border-outline-variant text-on-surface hover:bg-surface-container-low transition-colors duration-200 shadow-sm">
<img alt="Google Logo" class="w-5 h-5 object-contain" data-alt="A clean, minimalist 2D vector icon of the Google 'G' logo, set against a transparent background. The icon should be recognizable, utilizing the standard Google brand colors (blue, red, yellow, green) but slightly muted to match a warm, modern-organic aesthetic. Simple, crisp lines, perfect for UI integration." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjacshgzWOQ8WuNL0xSrsA8KI8gDVpnJfFREQXTqfIuhpDTR-Q8dedwM_4Zul7jWIrjh4P51VOmO6Ubm1gt5tR0_LNlfUTPYsg09EpKyiphn7w_b685MHzQJb7lXfdVk8MlDfUB-qqL_aaCjxz8sbwm5al0NSnR4KPwUP5KeEyJYvGHVfPuxd7tyxcc7RAIFVBpodOLVg5lLaPnUOfWjKXI1hNIbkfI6xDRi0G0FGVMhhN_rrVi94aJQ"/>
<span class="font-label-md text-label-md">Sign in with Google</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-unit text-on-surface-variant opacity-70">
<div class="h-px flex-1 bg-outline-variant"></div>
<span class="font-label-sm text-label-sm uppercase tracking-wider">or continue with email</span>
<div class="h-px flex-1 bg-outline-variant"></div>
</div>
<!-- Traditional Form -->
<form class="flex flex-col gap-stack-md">
<div class="input-floating-label bg-surface-container-low rounded-xl border border-outline/20">
<input class="w-full bg-transparent border-none rounded-xl focus:ring-0 focus:outline-none text-on-surface font-body-md text-body-md px-4" id="email" placeholder=" " required="" type="email"/>
<label class="font-label-sm text-label-sm" for="email">Email Address</label>
</div>
<div class="input-floating-label bg-surface-container-low rounded-xl border border-outline/20">
<input class="w-full bg-transparent border-none rounded-xl focus:ring-0 focus:outline-none text-on-surface font-body-md text-body-md px-4" id="password" placeholder=" " required="" type="password"/>
<label class="font-label-sm text-label-sm" for="password">Password</label>
</div>
<div class="flex justify-between items-center px-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-outline-variant text-primary focus:ring-primary w-4 h-4 bg-surface-container-low" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-tertiary transition-colors hover:underline" href="#">Forgot password?</a>
</div>
<button class="mt-2 w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl shadow-sm hover:-translate-y-0.5 hover:shadow-md transition-all duration-200 active:scale-95 flex items-center justify-center gap-2" type="button">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Sign Up Prompt -->
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-2">
                New to the neighborhood? 
                <a class="text-primary font-semibold hover:text-tertiary hover:underline transition-colors" href="#">Create an account</a>
</p>
<!-- Info banner for OTP -->
<div class="mt-4 p-4 rounded-lg bg-surface-container-highest border border-outline-variant/50 flex items-start gap-3">
<span class="material-symbols-outlined text-secondary text-[20px] mt-0.5" style="font-variation-settings: 'FILL' 1;">shield</span>
<p class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed">
                     For your security, a one-time passcode (OTP) will be sent to your email upon sign-in.
                 </p>
</div>
</div>
</div>
</body></html>
